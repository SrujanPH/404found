<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EcoMarket</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <span class="logo-icon">🌱</span>
                    <h1>EcoMarket</h1>
                </div>
                <h2 class="auth-title">Welcome Back</h2>
                <p class="auth-subtitle">Reconnect with our sustainable community</p>
            </div>

            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <label for="email" class="form-label">
                        <span class="label-icon">📧</span>
                        Email Address
                    </label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">
                        <span class="label-icon">🔒</span>
                        Password
                    </label>
                    <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" required>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember" name="remember">
                        <span class="checkbox-custom"></span>
                        Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-full" id="loginBtn">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-loader" style="display: none;">🔄</span>
                </button>

                <div class="auth-divider">
                    <span>or</span>
                </div>

                <button type="button" class="btn btn-google" id="googleLoginBtn">
                    <span class="google-icon">🔍</span>
                    Continue with Google
                </button>

                <div class="auth-footer">
                    <p>Don't have an account? <a href="register.html" class="auth-link">Join our community</a></p>
                </div>
            </form>

            <div class="error-message" id="errorMessage" style="display: none;"></div>
        </div>

        <div class="auth-visual">
            <div class="visual-content">
                <h3>Sustainable Shopping Made Easy</h3>
                <p>Every purchase on EcoMarket helps reduce waste and supports a circular economy.</p>
                <div class="eco-benefits">
                    <div class="benefit">
                        <span class="benefit-icon">♻️</span>
                        <span>Reduce Waste</span>
                    </div>
                    <div class="benefit">
                        <span class="benefit-icon">🌍</span>
                        <span>Save CO₂</span>
                    </div>
                    <div class="benefit">
                        <span class="benefit-icon">💚</span>
                        <span>Support Community</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
