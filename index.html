<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoMarket - Sustainable Second-Hand Marketplace</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <span class="logo-icon">🌱</span>
                <h1>EcoMarket</h1>
            </div>
            <nav class="nav">
                <a href="login.html" class="nav-link">Login</a>
                <a href="register.html" class="nav-link">Register</a>
            </nav>
        </header>

        <main class="hero">
            <div class="hero-content">
                <h2 class="hero-title">Give Items a Second Life</h2>
                <p class="hero-subtitle">Join our sustainable marketplace where every purchase helps reduce waste and protect our planet.</p>
                <div class="hero-actions">
                    <a href="register.html" class="btn btn-primary">Get Started</a>
                    <a href="login.html" class="btn btn-secondary">Sign In</a>
                </div>
                <div class="hero-stats">
                    <div class="stat">
                        <span class="stat-number">10,000+</span>
                        <span class="stat-label">Items Saved</span>
                    </div>
                    <div class="stat">
                        <span class="stat-number">5,000kg</span>
                        <span class="stat-label">CO₂ Reduced</span>
                    </div>
                    <div class="stat">
                        <span class="stat-number">2,500</span>
                        <span class="stat-label">Happy Users</span>
                    </div>
                </div>
            </div>
            <div class="hero-image">
                <img src="/placeholder.svg?height=400&width=500" alt="Sustainable marketplace illustration">
            </div>
        </main>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
