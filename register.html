<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - EcoMarket</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <span class="logo-icon">🌱</span>
                    <h1>EcoMarket</h1>
                </div>
                <h2 class="auth-title">Join Our Green Community</h2>
                <p class="auth-subtitle">Start your sustainable shopping journey today</p>
            </div>

            <form class="auth-form" id="registerForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="fullName" class="form-label">
                            <span class="label-icon">👤</span>
                            Full Name
                        </label>
                        <input type="text" id="fullName" name="fullName" class="form-input" placeholder="Your full name" required>
                    </div>

                    <div class="form-group">
                        <label for="username" class="form-label">
                            <span class="label-icon">🏷️</span>
                            Username
                        </label>
                        <input type="text" id="username" name="username" class="form-input" placeholder="Choose a green username" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">
                        <span class="label-icon">📧</span>
                        Email Address
                    </label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label for="location" class="form-label">
                        <span class="label-icon">📍</span>
                        Location
                    </label>
                    <input type="text" id="location" name="location" class="form-input" placeholder="City, State" required>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">
                        <span class="label-icon">🔒</span>
                        Password
                    </label>
                    <input type="password" id="password" name="password" class="form-input" placeholder="Create a strong password" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword" class="form-label">
                        <span class="label-icon">🔒</span>
                        Confirm Password
                    </label>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" placeholder="Confirm your password" required>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="terms" name="terms" required>
                        <span class="checkbox-custom"></span>
                        I agree to the <a href="#" class="terms-link">Terms of Service</a> and <a href="#" class="terms-link">Privacy Policy</a>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-full" id="registerBtn">
                    <span class="btn-text">Create Account</span>
                    <span class="btn-loader" style="display: none;">🔄</span>
                </button>

                <div class="auth-divider">
                    <span>or</span>
                </div>

                <button type="button" class="btn btn-google" id="googleRegisterBtn">
                    <span class="google-icon">🔍</span>
                    Sign up with Google
                </button>

                <div class="auth-footer">
                    <p>Already have an account? <a href="login.html" class="auth-link">Sign in here</a></p>
                </div>
            </form>

            <div class="error-message" id="errorMessage" style="display: none;"></div>
        </div>

        <div class="auth-visual">
            <div class="visual-content">
                <h3>Make a Difference Today</h3>
                <p>Join thousands of eco-conscious users who are making sustainable choices every day.</p>
                <div class="community-stats">
                    <div class="stat">
                        <span class="stat-number">2,500+</span>
                        <span class="stat-label">Active Members</span>
                    </div>
                    <div class="stat">
                        <span class="stat-number">10,000+</span>
                        <span class="stat-label">Items Traded</span>
                    </div>
                    <div class="stat">
                        <span class="stat-number">5 tons</span>
                        <span class="stat-label">CO₂ Saved</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
